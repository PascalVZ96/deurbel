mqtt:
  enabled: false

# Eerste AI-fase: volledig lokaal op de Intel iGPU.
detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Frigate draait in een eigen Docker-netwerk. host.docker.internal wijst terug
# naar de Ubuntu-host waar de bestaande deurbel-viewer op poort 8090 draait.
# go2rtc zet de MJPEG-feed eenmalig om naar H264 voor Frigate.
go2rtc:
  streams:
    voordeur:
      - "ffmpeg:http://host.docker.internal:8090/stream.mjpg#video=h264#hardware"

face_recognition:
  enabled: true
  model_size: small

cameras:
  voordeur:
    enabled: true
    ffmpeg:
      hwaccel_args: preset-vaapi
      inputs:
        - path: rtsp://127.0.0.1:8554/voordeur
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 920
      fps: 5
    objects:
      track:
        - person
        - dog
        - cat
    # Composite Eufy-beeld: boven 640x480, 80px scheiding, onder 640x360.
    # Voor fase 1 maskeren we alles vanaf y=480 zodat AI alleen de hoofdcamera
    # analyseert. Pixelcoordinaten zijn hier bewust integers; dit vermijdt de
    # Frigate-validatiefout op relatieve 0.000-coordinaten die op deze installatie optrad.
    motion:
      mask:
        - 0,480,640,480,640,920,0,920
    snapshots:
      enabled: true
    record:
      enabled: false
