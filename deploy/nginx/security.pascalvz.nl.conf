# Security Center reverse proxy
# Eerste installatie gebruikt HTTP; Certbot voegt daarna automatisch HTTPS toe.

server {
    listen 80;
    listen [::]:80;

    server_name security.pascalvz.nl;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Camerastreams, Frigate WebSockets en lange responses direct doorgeven.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 100m;
    }
}
