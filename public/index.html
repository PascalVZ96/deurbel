<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voordeur</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111318;
      color: #f5f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app { width: min(100%, 860px); }
    .topbar { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:14px; }
    h1 { margin:0; font-size:clamp(26px,5vw,42px); }
    .sub { margin-top:5px; color:#aeb6c5; }
    .badge { padding:8px 12px; border-radius:999px; background:#242933; color:#c6cedd; font-size:13px; white-space:nowrap; }
    .viewer {
      position:relative; min-height:360px; aspect-ratio:16/10; background:#050607;
      border:1px solid #2b313d; border-radius:18px; overflow:hidden; display:grid;
      place-items:center; box-shadow:0 18px 60px rgba(0,0,0,.35);
    }
    #stream { width:100%; height:100%; object-fit:contain; display:none; background:#000; }
    .placeholder { text-align:center; padding:24px; color:#9ea8ba; }
    .placeholder strong { display:block; color:#fff; font-size:22px; margin-bottom:7px; }
    .controls { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    button { border:0; border-radius:12px; padding:13px 18px; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #start { background:#fff; color:#101216; }
    #stop { background:#2b3039; color:#fff; }
    .details {
      margin-top:14px; padding:14px 16px; border-radius:14px; background:#191d24;
      border:1px solid #282e38; display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
      gap:12px; font-size:13px;
    }
    .kv span { display:block; color:#8893a6; margin-bottom:3px; }
    .kv b { font-weight:600; word-break:break-word; }
    .error { display:none; margin-top:12px; padding:12px 14px; border-radius:12px; background:#341c20; color:#ffd1d7; border:1px solid #63323a; white-space:pre-wrap; }
    @media (max-width:600px) {
      body { padding:12px; }
      .topbar { align-items:start; flex-direction:column; }
      .viewer { min-height:300px; aspect-ratio:3/4; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>Voordeur</h1>
        <div class="sub">Eufy deurbelviewer</div>
      </div>
      <div id="badge" class="badge">Verbinden…</div>
    </div>

    <section class="viewer">
      <img id="stream" alt="Livebeeld voordeur">
      <div id="placeholder" class="placeholder">
        <strong>Livebeeld staat uit</strong>
        Druk op “Live bekijken” om de deurbel tijdelijk te starten.
      </div>
    </section>

    <div class="controls">
      <button id="start">▶ Live bekijken</button>
      <button id="stop" disabled>■ Stop</button>
    </div>

    <div id="error" class="error"></div>

    <section class="details">
      <div class="kv"><span>Eufy verbinding</span><b id="ws">-</b></div>
      <div class="kv"><span>Viewer</span><b id="active">-</b></div>
      <div class="kv"><span>Ontvangen</span><b id="source">-</b></div>
      <div class="kv"><span>Actieve videobron</span><b id="selected">-</b></div>
      <div class="kv"><span>Gedetecteerde bronnen</span><b id="sources">-</b></div>
      <div class="kv"><span>Frames</span><b id="frames">-</b></div>
      <div class="kv"><span>Kijkers</span><b id="clients">-</b></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const startBtn = $('start');
    const stopBtn = $('stop');
    const stream = $('stream');
    const placeholder = $('placeholder');
    const errorBox = $('error');
    let lastActive = false;

    async function api(path, options = {}) {
      const response = await fetch(path, { cache:'no-store', ...options });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Onbekende fout');
      return data;
    }

    function showStream() {
      stream.src = '/stream.mjpg?t=' + Date.now();
      stream.style.display = 'block';
      placeholder.style.display = 'none';
    }

    function hideStream() {
      stream.removeAttribute('src');
      stream.style.display = 'none';
      placeholder.style.display = 'block';
    }

    async function refresh() {
      try {
        const s = await api('/api/status');
        const ready = s.wsConnected && s.listening && s.serialConfigured;
        const sourceCount = Object.keys(s.streams || {}).length;

        $('badge').textContent = s.active ? (s.frames > 0 ? '● Live' : '● Verbinden…') : (ready ? 'Gereed' : 'Niet gereed');
        $('ws').textContent = s.wsConnected ? 'Verbonden' : 'Niet verbonden';
        $('active').textContent = s.active ? 'Live' : 'Gestopt';
        $('source').textContent = s.codec ? `${s.codec} ${s.width || '?'}×${s.height || '?'} ${s.fps || '?'}fps` : '-';
        $('selected').textContent = s.selectedStream || (s.active ? 'Automatisch zoeken…' : '-');
        $('sources').textContent = sourceCount ? String(sourceCount) : '-';
        $('frames').textContent = s.frames ?? 0;
        $('clients').textContent = s.clients ?? 0;

        startBtn.disabled = !ready || s.active;
        stopBtn.disabled = !s.active;

        if (s.active && !lastActive) showStream();
        if (!s.active && lastActive) hideStream();
        lastActive = s.active;

        if (s.lastError) {
          errorBox.textContent = s.lastError;
          errorBox.style.display = 'block';
        } else {
          errorBox.style.display = 'none';
        }
      } catch (error) {
        $('badge').textContent = 'Paginafout';
        errorBox.textContent = error.message;
        errorBox.style.display = 'block';
      }
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      errorBox.style.display = 'none';
      try {
        await api('/api/start', { method:'POST' });
        showStream();
        lastActive = true;
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = 'block';
      }
      refresh();
    });

    stopBtn.addEventListener('click', async () => {
      stopBtn.disabled = true;
      try { await api('/api/stop', { method:'POST' }); } catch {}
      hideStream();
      lastActive = false;
      refresh();
    });

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
