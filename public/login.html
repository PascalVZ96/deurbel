<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Inloggen · Security Center</title>
  <style>
    :root{color-scheme:dark;--bg:#090d12;--panel:#111720;--line:#26303d;--text:#f5f7fb;--muted:#8f9bad;--danger:#ff7385;--good:#58d68d}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% -10%,rgba(75,125,205,.18),transparent 34%),radial-gradient(circle at 100% 0,rgba(61,116,90,.11),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{width:min(100%,430px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}.brand-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#20314a,#132032);border:1px solid #304665;font-size:23px;box-shadow:0 16px 50px rgba(0,0,0,.25)}.brand-title{font-weight:850;font-size:19px}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(21,28,38,.98),rgba(15,21,29,.98));box-shadow:0 24px 90px rgba(0,0,0,.38);padding:25px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#8291a6}.eyebrow:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(88,214,141,.1);margin-right:8px;vertical-align:1px}h1{font-size:30px;letter-spacing:-.04em;margin:10px 0 7px}.intro{margin:0 0 22px;color:#a5b0c0;font-size:13px;line-height:1.55}
    label{display:block;font-size:12px;font-weight:760;color:#b9c4d2;margin:14px 0 7px}.field{position:relative}.field input{width:100%;min-height:48px;border-radius:13px;border:1px solid #303b4a;background:#0c1219;color:#f5f7fb;padding:11px 13px;font:inherit;outline:none;transition:.15s}.field input:focus{border-color:#5d84b9;box-shadow:0 0 0 3px rgba(93,132,185,.13)}.password input{padding-right:78px}.toggle{position:absolute;right:7px;top:7px;bottom:7px;border:0;border-radius:9px;background:#18212d;color:#aeb9c8;font-size:11px;font-weight:760;padding:0 10px;cursor:pointer}
    .submit{width:100%;min-height:48px;border:0;border-radius:13px;margin-top:20px;background:#f5f7fb;color:#10141a;font:inherit;font-weight:820;cursor:pointer;transition:.15s}.submit:hover:not(:disabled){transform:translateY(-1px)}.submit:disabled{opacity:.55;cursor:wait}.error{display:none;margin-top:13px;padding:11px 12px;border-radius:11px;border:1px solid #64313a;background:#341a20;color:#ffd0d6;font-size:12px;line-height:1.45}.foot{text-align:center;color:#667487;font-size:11px;margin-top:14px;line-height:1.5}.lock{font-size:12px;color:#91a0b4;margin-top:16px;display:flex;align-items:center;gap:7px;justify-content:center}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <div><div class="brand-title">Security Center</div><div class="brand-sub">Privé cameradashboard</div></div>
    </div>

    <section class="card">
      <div class="eyebrow">Beveiligde toegang</div>
      <h1>Welkom terug</h1>
      <p class="intro">Log in om je camera’s, AI-meldingen en opnames te bekijken.</p>

      <form id="loginForm" autocomplete="on">
        <label for="username">Gebruikersnaam</label>
        <div class="field"><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>

        <label for="password">Wachtwoord</label>
        <div class="field password">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="toggle" id="togglePassword" type="button">Tonen</button>
        </div>

        <button class="submit" id="submitButton" type="submit">Inloggen</button>
        <div class="error" id="errorBox" role="alert"></div>
      </form>
      <div class="lock">🔒 Je camerabeelden blijven achter een server-side login.</div>
    </section>
    <div class="foot">Security Center · alleen voor geautoriseerde toegang</div>
  </main>

  <script>
    const form=document.getElementById('loginForm');
    const username=document.getElementById('username');
    const password=document.getElementById('password');
    const submitButton=document.getElementById('submitButton');
    const errorBox=document.getElementById('errorBox');
    const togglePassword=document.getElementById('togglePassword');
    const params=new URLSearchParams(location.search);
    const next=params.get('next') || '/';

    togglePassword.addEventListener('click',()=>{
      const show=password.type === 'password';
      password.type=show ? 'text' : 'password';
      togglePassword.textContent=show ? 'Verbergen' : 'Tonen';
      password.focus();
    });

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      errorBox.style.display='none';
      submitButton.disabled=true;
      submitButton.textContent='Bezig…';
      try{
        const response=await fetch('/api/auth/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username:username.value,password:password.value,next}),
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error || `Inloggen mislukt (HTTP ${response.status})`);
        location.replace(data.next || '/');
      }catch(error){
        errorBox.textContent=error.message || 'Inloggen mislukt.';
        errorBox.style.display='block';
        password.select();
      }finally{
        submitButton.disabled=false;
        submitButton.textContent='Inloggen';
      }
    });
  </script>
</body>
</html>
