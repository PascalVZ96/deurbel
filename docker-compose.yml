services:
  deurbel-viewer:
    build: .
    container_name: deurbel-viewer
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      TZ: Europe/Amsterdam
      EUFY_SERIAL: ${EUFY_SERIAL}
      EUFY_STATION_SERIAL: ${EUFY_STATION_SERIAL:-T8030T2324151AF5}
      EUFY_WS_URL: ${EUFY_WS_URL:-ws://127.0.0.1:3000}
      WEB_PORT: ${WEB_PORT:-8090}
      VIEWER_PORT: ${VIEWER_PORT:-8092}
      MJPEG_FPS: ${MJPEG_FPS:-8}
      MJPEG_QUALITY: ${MJPEG_QUALITY:-5}
      WATCHDOG_SECONDS: ${WATCHDOG_SECONDS:-8}
      FORCE_STREAMING_QUALITY: ${FORCE_STREAMING_QUALITY:-1}
      CONTINUOUS_STREAM_ENABLED: ${CONTINUOUS_STREAM_ENABLED:-0}
      CONTINUOUS_STREAM_CHECK_MS: ${CONTINUOUS_STREAM_CHECK_MS:-5000}
      EVENT_RECORD_SECONDS: ${EVENT_RECORD_SECONDS:-30}
      EVENT_WAKE_TIMEOUT_SECONDS: ${EVENT_WAKE_TIMEOUT_SECONDS:-15}
      MAX_RECORD_SECONDS: ${MAX_RECORD_SECONDS:-120}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      HOMEBASE_POLL_MS: ${HOMEBASE_POLL_MS:-5000}
      HOMEBASE_RECOVER_AFTER_FAILURES: ${HOMEBASE_RECOVER_AFTER_FAILURES:-3}
      HOMEBASE_RECONNECT_MS: ${HOMEBASE_RECONNECT_MS:-3000}
      BATTERY_POLL_MS: ${BATTERY_POLL_MS:-300000}
      BATTERY_CHARGING_POLL_MS: ${BATTERY_CHARGING_POLL_MS:-120000}
      BATTERY_LOW_PERCENT: ${BATTERY_LOW_PERCENT:-20}
      BATTERY_CRITICAL_PERCENT: ${BATTERY_CRITICAL_PERCENT:-10}
      PROCESS_RESTART_DELAY_SECONDS: ${PROCESS_RESTART_DELAY_SECONDS:-3}
      LSC_RTSP_URL: ${LSC_RTSP_URL:-}
      LSC_PROXY_PORT: ${LSC_PROXY_PORT:-8093}
      LSC_MJPEG_FPS: ${LSC_MJPEG_FPS:-12}
      LSC_MJPEG_QUALITY: ${LSC_MJPEG_QUALITY:-2}
      LSC_IDLE_STOP_SECONDS: ${LSC_IDLE_STOP_SECONDS:-10}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-1}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NOTIFY_DASHBOARD_URL: ${NOTIFY_DASHBOARD_URL:-http://192.168.178.23:8090}
      NOTIFY_POLL_MS: ${NOTIFY_POLL_MS:-5000}
      NOTIFY_LSC: ${NOTIFY_LSC:-1}
      NOTIFY_EUFY: ${NOTIFY_EUFY:-1}
      NOTIFY_PETFEEDER: ${NOTIFY_PETFEEDER:-1}
      PETFEEDER_RTSP_URL: ${PETFEEDER_RTSP_URL:-rtsp://127.0.0.1:8556/Pet_Feeder/hd}
      PETFEEDER_PROXY_PORT: ${PETFEEDER_PROXY_PORT:-8094}
      PETFEEDER_MJPEG_FPS: ${PETFEEDER_MJPEG_FPS:-8}
      PETFEEDER_MJPEG_QUALITY: ${PETFEEDER_MJPEG_QUALITY:-5}
      PETFEEDER_IDLE_STOP_SECONDS: ${PETFEEDER_IDLE_STOP_SECONDS:-10}
      GEMINI_API_KEY: ${FRIGATE_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      EUFY_AI_ENABLED: ${EUFY_AI_ENABLED:-1}
      EUFY_AI_POLL_MS: ${EUFY_AI_POLL_MS:-5000}
      EUFY_AI_RETRY_MS: ${EUFY_AI_RETRY_MS:-900000}
      EUFY_AI_MAX_FRAMES: ${EUFY_AI_MAX_FRAMES:-6}
      FRIGATE_FALLBACK_ENABLED: ${FRIGATE_FALLBACK_ENABLED:-1}
      FRIGATE_FALLBACK_MODEL: ${FRIGATE_FALLBACK_MODEL:-gemini-3.6-flash}
      FRIGATE_FALLBACK_DELAY_SECONDS: ${FRIGATE_FALLBACK_DELAY_SECONDS:-90}
      FRIGATE_FALLBACK_POLL_MS: ${FRIGATE_FALLBACK_POLL_MS:-30000}
      FRIGATE_FALLBACK_MAX_AGE_MINUTES: ${FRIGATE_FALLBACK_MAX_AGE_MINUTES:-60}
      LSC_RESTART_DELAY_MS: ${LSC_RESTART_DELAY_MS:-2000}
      RECORDINGS_DIR: /recordings
      DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.WEB_PORT||'8090')+'/api/status').then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()}).then(d=>process.exit(d.wsConnected&&d.homebase?.healthy&&d.security?.storage?.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 60s
    volumes:
      - type: bind
        source: /mnt/security/deurbel
        target: /recordings
        bind:
          create_host_path: false
      - ./data:/data

  # Frigate blijft een optioneel profiel. De AI-container draait bewust NIET in
  # host-networking: op de Ubuntu-host zijn 1984/8554/8555 al bezet. In bridge
  # mode kan Frigate zijn eigen go2rtc-poorten intern gebruiken zonder conflicten.
  frigate:
    profiles: ["ai"]
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "1024mb"
    ports:
      - "8971:8971"
      - "127.0.0.1:5000:5000"
    environment:
      FRIGATE_GEMINI_API_KEY: ${FRIGATE_GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate:/config
      - type: bind
        source: /mnt/security/frigate
        target: /media/frigate
        bind:
          create_host_path: false
