services:
  deurbel-viewer:
    build: .
    container_name: deurbel-viewer
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      TZ: Europe/Amsterdam
      EUFY_SERIAL: ${EUFY_SERIAL}
      EUFY_STATION_SERIAL: ${EUFY_STATION_SERIAL:-T8030T2324151AF5}
      EUFY_WS_URL: ${EUFY_WS_URL:-ws://127.0.0.1:3000}
      WEB_PORT: ${WEB_PORT:-8090}
      VIEWER_PORT: ${VIEWER_PORT:-8092}
      MJPEG_FPS: ${MJPEG_FPS:-8}
      MJPEG_QUALITY: ${MJPEG_QUALITY:-5}
      WATCHDOG_SECONDS: ${WATCHDOG_SECONDS:-8}
      FORCE_STREAMING_QUALITY: ${FORCE_STREAMING_QUALITY:-1}
      EVENT_RECORD_SECONDS: ${EVENT_RECORD_SECONDS:-30}
      EVENT_WAKE_TIMEOUT_SECONDS: ${EVENT_WAKE_TIMEOUT_SECONDS:-15}
      MAX_RECORD_SECONDS: ${MAX_RECORD_SECONDS:-120}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      HOMEBASE_POLL_MS: ${HOMEBASE_POLL_MS:-5000}
      HOMEBASE_RECOVER_AFTER_FAILURES: ${HOMEBASE_RECOVER_AFTER_FAILURES:-3}
      HOMEBASE_RECONNECT_MS: ${HOMEBASE_RECONNECT_MS:-3000}
      PROCESS_RESTART_DELAY_SECONDS: ${PROCESS_RESTART_DELAY_SECONDS:-3}
      RECORDINGS_DIR: /recordings
      DATA_DIR: /data
    volumes:
      - type: bind
        source: /mnt/security/deurbel
        target: /recordings
        bind:
          create_host_path: false
      - ./data:/data
