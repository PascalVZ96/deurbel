services:
  deurbel-viewer:
    build: .
    container_name: deurbel-viewer
    network_mode: host
    restart: unless-stopped
    environment:
      EUFY_SERIAL: ${EUFY_SERIAL}
      EUFY_WS_URL: ${EUFY_WS_URL:-ws://127.0.0.1:3000}
      WEB_PORT: ${WEB_PORT:-8090}
      VIEWER_PORT: ${VIEWER_PORT:-8092}
      MJPEG_FPS: ${MJPEG_FPS:-8}
      MJPEG_QUALITY: ${MJPEG_QUALITY:-5}
      WATCHDOG_SECONDS: ${WATCHDOG_SECONDS:-8}
      MOTION_FPS: ${MOTION_FPS:-2}
      MOTION_PIXEL_THRESHOLD: ${MOTION_PIXEL_THRESHOLD:-24}
      MOTION_THRESHOLD_PERCENT: ${MOTION_THRESHOLD_PERCENT:-1.5}
      MOTION_MIN_HITS: ${MOTION_MIN_HITS:-2}
      MOTION_WARMUP_SECONDS: ${MOTION_WARMUP_SECONDS:-3}
      PRE_RECORD_SECONDS: ${PRE_RECORD_SECONDS:-5}
      POST_RECORD_SECONDS: ${POST_RECORD_SECONDS:-15}
      MAX_RECORD_SECONDS: ${MAX_RECORD_SECONDS:-300}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      RECORDINGS_DIR: /recordings
      DATA_DIR: /data
    volumes:
      - ${RECORDINGS_HOST_PATH:-./recordings}:/recordings
      - ./data:/data
