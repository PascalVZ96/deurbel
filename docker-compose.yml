services:
  deurbel-viewer:
    build: .
    container_name: deurbel-viewer
    network_mode: host
    restart: unless-stopped
    environment:
      EUFY_SERIAL: ${EUFY_SERIAL}
      EUFY_WS_URL: ${EUFY_WS_URL:-ws://127.0.0.1:3000}
      WEB_PORT: ${WEB_PORT:-8090}
      VIEWER_PORT: ${VIEWER_PORT:-8092}
      MJPEG_FPS: ${MJPEG_FPS:-8}
      MJPEG_QUALITY: ${MJPEG_QUALITY:-5}
      WATCHDOG_SECONDS: ${WATCHDOG_SECONDS:-8}
      EVENT_RECORD_SECONDS: ${EVENT_RECORD_SECONDS:-30}
      EVENT_WAKE_TIMEOUT_SECONDS: ${EVENT_WAKE_TIMEOUT_SECONDS:-15}
      MAX_RECORD_SECONDS: ${MAX_RECORD_SECONDS:-120}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      RECORDINGS_DIR: /recordings
      DATA_DIR: /data
    volumes:
      - ${RECORDINGS_HOST_PATH:-./recordings}:/recordings
      - ./data:/data
